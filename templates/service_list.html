<ul class="service-list">
    {% for service in microservices %}
    <li>
        <a class="service-row" href="{{ service.url }}">
            <span class="service-identity">
                <strong>{{ service.name }}</strong>
                {% if service.description %}<small>{{ service.description }}</small>{% endif %}
            </span>
            <span class="service-destination"><code>{{ service.url }}</code><span class="service-arrow" aria-hidden="true">↗</span></span>
        </a>
    </li>
    {% else %}
    <li class="empty-list">Пока нет добавленных сервисов.</li>
    {% endfor %}
</ul>
